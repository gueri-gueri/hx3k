name: Release

# Push a tag like v0.1.0 (the version in package.json, with a "v") and this
# packages the app on the three systems and opens a draft release with the
# installers. Run by hand, it only packages: the files stay in the run's
# artifacts and no release is made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # electron-builder names the files after package.json, not after the tag.
      - name: Check that the tag is the version in package.json
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # "--publish never": on a tag, electron-builder would otherwise try to
      # upload by itself. The release job below does that, once, for all three.
      - name: Build and package
        run: npm run dist -- --publish never
        env:
          # Optional. Set the repository variable T3K_PUBLISHABLE_KEY to embed the
          # TONE3000 publishable key; without it the app asks for one on first run.
          MAIN_VITE_T3K_PUBLISHABLE_KEY: ${{ vars.T3K_PUBLISHABLE_KEY }}
          # There is no signing certificate: do not look for one in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: hx3k-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          # The installers are already compressed.
          compression-level: 0
          retention-days: 14

  release:
    name: Draft the release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For .github/release-notes.md. It comes first: checkout empties the folder.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # A draft: it shows on the Releases page only after you publish it there.
      # Its text is the install instructions of .github/release-notes.md, then
      # the list of changes GitHub writes. Re-running the job replaces the files
      # of the draft it already made and leaves the text as it is.
      - name: Create the draft release, or refresh its files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            sed -e "s|{{version}}|${GITHUB_REF_NAME#v}|g" -e "s|{{repo}}|$GITHUB_REPOSITORY|g" \
              .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "HX3K ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --generate-notes \
              --verify-tag \
              --draft
          fi
