appId: app.hx3k.desktop
productName: HX3K
copyright: Copyright © 2026 HX3K contributors. GPL-3.0-or-later.

directories:
  output: release
  buildResources: build

# Everything the app runs is bundled into out/ by electron-vite.
files:
  - out/**/*
  - package.json

# The licenses travel with the app, as the GPL asks.
extraResources:
  - LICENSE
  - NOTICE

mac:
  category: public.app-category.music
  # There is no Developer ID certificate, so the signature is ad-hoc: without
  # any, Apple Silicon calls a downloaded app damaged. The hardened runtime is
  # off because, ad-hoc, it stops the app from loading Electron's own frameworks.
  identity: "-"
  hardenedRuntime: false
  target:
    - dmg
    - zip

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Audio
  # The .deb does not build without a maintainer.
  maintainer: HX3K contributors <gueri-gueri@users.noreply.github.com>
  target:
    - AppImage
    - deb
